<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Legal Guardian Angels</title>
  <style>
    :root {
      --cream:#F7F2E7;
      --ink:#232323;
      --dark:#445b83;
      --gold:#83b5dd;
      --gold-dark:#2d699e;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    body{
      font-family: Inter, Arial, sans-serif;
      background:var(--cream);
      color:var(--ink);
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      background:#fff;
      border:1px solid #e7e0d1;
      border-radius:24px;
      box-shadow:0 16px 40px rgba(0,0,0,.08);
      padding:40px;
      max-width:640px;
      text-align:center;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:56px;
      height:56px;
      border-radius:50%;
      background:var(--gold);
      color:var(--dark);
      font-size:28px;
      margin-bottom:18px;
      font-weight:700;
    }
    h1{font-size:30px; margin-bottom:12px; color:var(--dark);}
    p{font-size:16px; line-height:1.6; color:#5b5850; margin-bottom:20px;}
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:12px 22px;
      border-radius:999px;
      background:var(--dark);
      color:#fff;
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">✓</div>
    <h1>Thanks for reaching out!</h1>
    <p>Your message has been received. We appreciate your interest in Legal Guardian Angels and will be in touch soon.</p>
    <a class="btn" href="index.html">Back to home</a>
  </div>
</body>
</html>
